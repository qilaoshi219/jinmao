<!-- ===== 用户统计卡片 ===== -->
<div class="stat-cards">
  <div class="stat-card">
    <div class="stat-value">{{ userSummary.total || 0 }}</div>
    <div class="stat-label">总用户数</div>
  </div>
  <div class="stat-card">
    <div class="stat-value">{{ userSummary.todayNew || 0 }}</div>
    <div class="stat-label">今日新增</div>
  </div>
  <div class="stat-card">
    <div class="stat-value">{{ userSummary.banned || 0 }}</div>
    <div class="stat-label">已禁用</div>
  </div>
  <div class="stat-card">
    <div class="stat-value">{{ userSummary.admins || 0 }}</div>
    <div class="stat-label">管理员数</div>
  </div>
</div>

<!-- ===== 用户筛选区 ===== -->
<el-card shadow="never" style="margin-bottom:20px;">
  <template #header>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-weight:700;color:#000;transition:color 500ms;" :style="{color: isDark ? '#fff' : '#000'}">用户查询</span>
      <span style="font-size:12px;color:#9ca3af;">支持按邮箱 / 昵称 / 用户名模糊搜索</span>
    </div>
  </template>
  <div class="filter-row">
    <el-input v-model="keyword" placeholder="邮箱 / 昵称 / 用户名" clearable style="width:220px;" @keyup.enter="searchUsers" @clear="searchUsers" />
    <el-select v-model="roleFilter" style="width:140px;" clearable @change="searchUsers">
      <el-option label="全部角色" value="all" />
      <el-option label="管理员" value="admin" />
      <el-option label="普通用户" value="user" />
    </el-select>
    <el-select v-model="bannedFilter" style="width:140px;" clearable @change="searchUsers">
      <el-option label="全部状态" value="all" />
      <el-option label="正常" value="false" />
      <el-option label="已禁用" value="true" />
    </el-select>
    <el-button type="primary" @click="searchUsers">🔍 查询</el-button>
    <el-button @click="resetFilters">重置</el-button>
  </div>
</el-card>

<!-- ===== 用户列表 ===== -->
<el-card shadow="never">
  <template #header>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-weight:700;color:#000;transition:color 500ms;" :style="{color: isDark ? '#fff' : '#000'}">用户列表</span>
    </div>
  </template>
  <el-table :data="userList" stripe v-loading="loadingUsers" empty-text="暂无用户">
    <el-table-column label="ID" width="90" align="center">
      <template #default="{ row }"><span style="font-family:monospace;">#{{ row.id }}</span></template>
    </el-table-column>
    <el-table-column prop="email" label="邮箱" min-width="200" />
    <el-table-column prop="nickname" label="昵称" width="120" />
    <el-table-column label="角色" width="90" align="center">
      <template #default="{ row }">
        <el-tag size="small" :type="row.role === 'admin' ? 'danger' : 'info'">{{ row.role === 'admin' ? '管理员' : '用户' }}</el-tag>
      </template>
    </el-table-column>
    <el-table-column label="VIP" width="90" align="center">
      <template #default="{ row }">
        <el-tag size="small" :type="vipType(row.vipLevel)">{{ vipLabel(row.vipLevel) }}</el-tag>
      </template>
    </el-table-column>
    <el-table-column label="余额" width="110" align="center">
      <template #default="{ row }">¥{{ parseFloat(row.balance).toFixed(2) }}</template>
    </el-table-column>
    <el-table-column label="计划" width="90" align="center">
      <template #default="{ row }">{{ row.plan || '-' }}</template>
    </el-table-column>
    <el-table-column label="状态" width="110" align="center">
      <template #default="{ row }">
        <el-tooltip v-if="row.isBanned && row.banReason" :content="row.banReason" placement="top">
          <el-tag size="small" type="danger">已禁用</el-tag>
        </el-tooltip>
        <el-tag v-else-if="row.isBanned" size="small" type="danger">已禁用</el-tag>
        <el-tag v-else size="small" type="success">正常</el-tag>
      </template>
    </el-table-column>
    <el-table-column label="注册时间" width="170" align="center">
      <template #default="{ row }">{{ formatTime(row.createTime) }}</template>
    </el-table-column>
    <el-table-column label="操作" width="140" align="center">
      <template #default="{ row }">
        <el-button v-if="!row.isBanned" link type="danger" size="small" :loading="operatingId === row.id" @click="banUser(row)">禁用</el-button>
        <el-button v-else link type="primary" size="small" :loading="operatingId === row.id" @click="unbanUser(row)">解禁</el-button>
      </template>
    </el-table-column>
  </el-table>
  <!-- 分页 -->
  <div style="margin-top:16px;display:flex;justify-content:flex-end;">
    <el-pagination
      v-model:current-page="userPage"
      v-model:page-size="userPageSize"
      :total="userTotal"
      :page-sizes="[10, 20, 50]"
      layout="total, sizes, prev, pager, next"
      @size-change="loadUsers"
      @current-change="loadUsers"
      small
    />
  </div>
</el-card>
