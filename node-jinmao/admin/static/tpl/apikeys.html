<!-- ===== API 密钥 ===== -->
<el-card shadow="never" style="margin-bottom:20px;">
  <template #header>
    <span style="font-weight:700;color:#000;transition:color 500ms;" :style="{color: isDark ? '#fff' : '#000'}">API 密钥说明</span>
  </template>
  <div style="font-size:13px;color:#6b7280;line-height:2;">
    <p>1. 此处可修改 5 个 AI 服务密钥，保存后直接写入服务器 .env 文件，<strong style="color:#409eff;">重启后端后生效</strong>（运行中的进程仍使用旧值）。</p>
    <p>2. 当前值仅脱敏显示（如 sk-ab***cdef），页面与接口均不会回传明文密钥。</p>
    <p>3. 输入框留空表示不修改该项；填写后点击下方「保存修改」统一提交。</p>
  </div>
</el-card>

<!-- ===== 密钥列表 ===== -->
<el-card shadow="never">
  <template #header>
    <span style="font-weight:700;color:#000;transition:color 500ms;" :style="{color: isDark ? '#fff' : '#000'}">AI 服务密钥</span>
  </template>

  <div v-if="loading" v-loading="true" style="min-height:160px;"></div>
  <template v-else>
    <div
      v-for="it in items"
      :key="it.key"
      style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid #e2e8f0;transition:border-color 500ms;"
      :style="{borderColor: isDark ? '#0f3460' : '#e2e8f0'}"
    >
      <!-- 服务名 -->
      <div style="width:200px;flex-shrink:0;">
        <div style="font-size:14px;font-weight:600;color:#000;transition:color 500ms;" :style="{color: isDark ? '#fff' : '#000'}">{{ it.label }}</div>
        <div style="font-size:12px;color:#9ca3af;margin-top:2px;">{{ it.key }}</div>
      </div>
      <!-- 状态 -->
      <div style="width:90px;flex-shrink:0;">
        <el-tag :type="it.configured ? 'success' : 'info'" size="small">{{ it.configured ? '已配置' : '未配置' }}</el-tag>
      </div>
      <!-- 当前值（脱敏） -->
      <div style="width:170px;flex-shrink:0;">
        <div style="font-size:12px;color:#6b7280;">当前值</div>
        <div style="font-family:monospace;font-size:14px;color:#6b7280;margin-top:2px;">{{ it.masked || '***' }}</div>
      </div>
      <!-- 新密钥输入 -->
      <div style="flex:1;min-width:240px;">
        <el-input
          v-model="it.newValue"
          type="password"
          show-password
          size="large"
          :placeholder="it.configured ? '留空则不修改' : '请输入 ' + it.key"
        />
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap;">
      <el-button type="primary" size="large" @click="saveKeys" :loading="saving">
        {{ saving ? '保存中...' : '保存修改' }}
      </el-button>
      <span style="font-size:12px;color:#9ca3af;">保存后请重启后端服务使配置生效。</span>
    </div>
  </template>
</el-card>
