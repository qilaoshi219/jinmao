<!-- ===== 未登录：登录视图 ===== -->
<login-view v-if="!isLoggedIn" />

<!-- ===== 已登录管理员：主界面 ===== -->
<admin-shell v-else-if="isAdmin" />

<!-- ===== 非管理员：403 ===== -->
<div v-else-if="isLoggedIn && !isAdmin && !checkingAdmin" class="forbidden">
  <div style="font-size:64px;margin-bottom:16px;">🚫</div>
  <h2 style="color:#ef4444;margin-bottom:8px;">403 禁止访问</h2>
  <p style="color:#6b7280;">您不是管理员，无权访问此页面。</p>
  <el-button @click="doLogout" type="primary" style="margin-top:20px;">退出登录</el-button>
</div>

<!-- ===== 身份校验中 ===== -->
<div v-if="checkingAdmin" style="text-align:center;padding:120px 20px;color:#6b7280;">
  <p>正在验证管理员身份...</p>
</div>
