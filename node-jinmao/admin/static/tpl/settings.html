<!-- ===== 系统设置 ===== -->
<el-card shadow="never">
  <template #header>
    <span style="font-weight:700;color:#000;transition:color 500ms;" :style="{color: isDark ? '#fff' : '#000'}">安全入口设置</span>
  </template>
  <!-- 当前后缀（脱敏） -->
  <div style="margin-bottom:20px;">
    <label style="font-size:13px;font-weight:600;color:#000;transition:color 500ms;" :style="{color: isDark ? '#fff' : '#000'}">当前安全后缀</label>
    <div style="margin-top:6px;font-family:monospace;font-size:14px;color:#6b7280;">
      {{ configSuffix }}（共 {{ configSuffixLength }} 位）
    </div>
    <div style="margin-top:4px;font-size:12px;color:#9ca3af;">
      访问地址: {{ windowLocation }}/admin/<strong>{{ configSuffix }}</strong>
    </div>
  </div>
  <!-- 修改后缀 -->
  <div style="display:flex;align-items:flex-end;gap:12px;">
    <div style="flex:1;">
      <label style="font-size:13px;font-weight:600;color:#000;transition:color 500ms;" :style="{color: isDark ? '#fff' : '#000'}">新安全后缀</label>
      <el-input v-model="newSuffix" placeholder="新安全后缀（4-32位字母数字下划线）" size="large" style="margin-top:6px;" />
    </div>
    <el-button type="primary" @click="updateSuffix" :loading="updatingSuffix" size="large">
      {{ updatingSuffix ? '保存中...' : '保存修改' }}
    </el-button>
  </div>
  <el-alert type="warning" :closable="false" show-icon style="margin-top:16px;" title="修改后旧后缀立即失效，请使用新后缀访问管理页面。建议立即在新标签页中测试新地址！" />
</el-card>
