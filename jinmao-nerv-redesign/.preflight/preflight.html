/* NERV Command Interface — Design Tokens */
/* 金毛教你学 NERV 风格设计系统 */

/* ============================================
   Light Mode (日间模式) — Tactical White
   ============================================ */
:root {
  /* Surface */
  --nerv-background: #f7f4ee;       /* 暖白战术背景 */
  --nerv-foreground: #1a1208;       /* 深棕黑文字 */
  --nerv-card: #ffffff;             /* 卡片白 */
  --nerv-card-foreground: #1a1208;  /* 卡片文字 */
  --nerv-popover: #ffffff;
  --nerv-popover-foreground: #1a1208;

  /* Primary — Hot Orange / 警报橙 */
  --nerv-primary: #ff5a00;
  --nerv-primary-foreground: #ffffff;

  /* Muted */
  --nerv-muted: #f0ebe0;            /* 暖灰底 */
  --nerv-muted-foreground: #8c7a60; /* 暖灰文字 */

  /* Structure */
  --nerv-border: #e0d8c8;           /* 暖卡其边框 */
  --nerv-input: #e0d8c8;
  --nerv-ring: #ff5a00;

  /* Radius — Sharp NERV geometry */
  --nerv-radius-sm: 2px;
  --nerv-radius-md: 4px;
  --nerv-radius-lg: 6px;

  /* State Colors */
  --nerv-success: #7cff6b;
  --nerv-success-foreground: #0a2e00;
  --nerv-warning: #ffb700;
  --nerv-warning-foreground: #2e1a00;
  --nerv-error: #ff1f4f;
  --nerv-error-foreground: #ffffff;
  --nerv-info: #ffb15a;
  --nerv-info-foreground: #1a0a00;

  /* NERV Tactical Extras */
  --nerv-rail: #ff5a00;             /* 状态轨 */
  --nerv-grid: rgba(255, 90, 0, 0.04);  /* 战术网格 */
  --nerv-scanline: rgba(0, 0, 0, 0.02); /* 扫描线 */
}

/* ============================================
   Dark Mode (夜间模式) — NERV Command Center
   ============================================ */
.dark {
  /* Surface */
  --nerv-background: #030100;       /* CRT 黑色虚空 */
  --nerv-foreground: #ffe7bc;       /* 淡黄磷光文字 */
  --nerv-card: #0b0502;             /* 面板黑棕 */
  --nerv-card-foreground: #ffe7bc;
  --nerv-popover: #160a03;
  --nerv-popover-foreground: #ffe7bc;

  /* Primary */
  --nerv-primary: #ff5a00;
  --nerv-primary-foreground: #030100;

  /* Muted */
  --nerv-muted: #160a03;            /* 暗控制填充 */
  --nerv-muted-foreground: #c89452; /* 暖棕次文字 */

  /* Structure */
  --nerv-border: #5f2709;           /* 低亮橙色结构线 */
  --nerv-input: #5f2709;
  --nerv-ring: #ff7a00;             /* 热橙聚焦 */

  /* State Colors */
  --nerv-success: #7cff6b;
  --nerv-success-foreground: #0a2e00;
  --nerv-warning: #ffd56f;
  --nerv-warning-foreground: #1a0a00;
  --nerv-error: #ff1f4f;
  --nerv-error-foreground: #030100;
  --nerv-info: #ffb15a;
  --nerv-info-foreground: #030100;

  /* NERV Tactical Extras */
  --nerv-rail: #ff5a00;
  --nerv-grid: rgba(255, 90, 0, 0.06);
  --nerv-scanline: rgba(255, 90, 0, 0.03);
}

/* ============================================
   System preference fallback (legacy)
   ============================================ */
@media (prefers-color-scheme: dark) {
  :root:not(.light) {
    --nerv-background: #030100;
    --nerv-foreground: #ffe7bc;
    --nerv-card: #0b0502;
    --nerv-card-foreground: #ffe7bc;
    --nerv-popover: #160a03;
    --nerv-popover-foreground: #ffe7bc;
    --nerv-primary: #ff5a00;
    --nerv-primary-foreground: #030100;
    --nerv-muted: #160a03;
    --nerv-muted-foreground: #c89452;
    --nerv-border: #5f2709;
    --nerv-input: #5f2709;
    --nerv-ring: #ff7a00;
  }
}

/* ============================================
   Global Base Styles
   ============================================ */
html {
  background-color: var(--nerv-background);
  color: var(--nerv-foreground);
  transition: background-color 500ms ease, color 500ms ease;
}

body {
  font-family: "Segoe UI", "Helvetica Neue", Arial, "PingFang SC",
    "Microsoft YaHei", system-ui, sans-serif;
  background-color: var(--nerv-background);
  color: var(--nerv-foreground);
}
